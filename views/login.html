<!DOCTYPE html>
<html lang="th" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ / สมัครสมาชิก | TimeWise Scheduler</title>
  <!-- Bootstrap 5 & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="d-flex flex-column min-vh-100">

  <!-- Navbar -->
  <nav class="navbar app-navbar sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="/">
        <div class="brand-icon-box">
          <i class="bi bi-clock-history"></i>
        </div>
        <span>TimeWise</span>
      </a>
      <div class="d-flex align-items-center gap-2">
        <button id="btnThemeToggle" class="btn btn-outline-secondary btn-sm">🌙 โหมดมืด</button>
        <a href="/" class="btn btn-outline-secondary btn-sm">
          <i class="bi bi-arrow-left me-1"></i> หน้าหลัก
        </a>
      </div>
    </div>
  </nav>

  <!-- Login Container -->
  <div class="container my-auto py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">
        
        <div class="text-center mb-4">
          <h3 class="fw-bold mb-1">ยินดีต้อนรับสู่ TimeWise</h3>
          <p class="text-muted small">ระบบจัดตารางกิจกรรมและคำนวณเวลาว่างอัจฉริยะ</p>
        </div>

        <div class="modern-card p-4 p-sm-4 shadow-sm">
          <!-- Auth Tabs -->
          <ul class="nav nav-pills nav-fill mb-4 p-1 bg-body-tertiary rounded-3" id="authTab" role="tablist">
            <li class="nav-item" role="presentation">
              <button class="nav-link active fw-semibold py-2 rounded-2" id="login-tab" data-bs-toggle="pill" data-bs-target="#tab-login" type="button" role="tab">
                เข้าสู่ระบบ
              </button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link fw-semibold py-2 rounded-2" id="register-tab" data-bs-toggle="pill" data-bs-target="#tab-register" type="button" role="tab">
                สมัครสมาชิก
              </button>
            </li>
          </ul>

          <div class="tab-content" id="authTabContent">
            <!-- Tab Login -->
            <div class="tab-pane fade show active" id="tab-login" role="tabpanel">
              <form id="formLogin">
                <div class="mb-3">
                  <label for="loginUsername" class="form-label small fw-semibold text-muted">ชื่อผู้ใช้งาน (Username)</label>
                  <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0 text-muted"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control border-start-0 ps-0" id="loginUsername" placeholder="กรอกชื่อผู้ใช้งาน" required autocomplete="username">
                  </div>
                </div>

                <div class="mb-3">
                  <label for="loginPassword" class="form-label small fw-semibold text-muted">รหัสผ่าน (Password)</label>
                  <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control border-start-0 ps-0" id="loginPassword" placeholder="กรอกรหัสผ่าน" required autocomplete="current-password">
                  </div>
                </div>

                <div class="mb-4 form-check">
                  <input type="checkbox" class="form-check-input" id="rememberMe">
                  <label class="form-check-label small text-muted" for="rememberMe">
                    จดจำชื่อผู้ใช้งานบนอุปกรณ์นี้ (Cookies)
                  </label>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fs-6">
                  เข้าสู่ระบบ <i class="bi bi-arrow-right ms-1"></i>
                </button>

                <div id="loginAlert" class="d-none"></div>
              </form>
            </div>

            <!-- Tab Register -->
            <div class="tab-pane fade" id="tab-register" role="tabpanel">
              <form id="formRegister">
                <div class="mb-3">
                  <label for="regFullName" class="form-label small fw-semibold text-muted">ชื่อ - นามสกุล</label>
                  <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0 text-muted"><i class="bi bi-card-text"></i></span>
                    <input type="text" class="form-control border-start-0 ps-0" id="regFullName" placeholder="เช่น กฤตนัย นุ่มแก้ว" required>
                  </div>
                </div>

                <div class="mb-3">
                  <label for="regUsername" class="form-label small fw-semibold text-muted">ชื่อผู้ใช้งาน (Username)</label>
                  <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0 text-muted"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control border-start-0 ps-0" id="regUsername" placeholder="อย่างน้อย 3 ตัวอักษร" required minlength="3">
                  </div>
                </div>

                <div class="mb-3">
                  <label for="regPassword" class="form-label small fw-semibold text-muted">รหัสผ่าน</label>
                  <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control border-start-0 ps-0" id="regPassword" placeholder="อย่างน้อย 6 ตัวอักษร" required minlength="6">
                  </div>
                </div>

                <div class="mb-4">
                  <label for="regPasswordConfirm" class="form-label small fw-semibold text-muted">ยืนยันรหัสผ่าน</label>
                  <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0 text-muted"><i class="bi bi-shield-check"></i></span>
                    <input type="password" class="form-control border-start-0 ps-0" id="regPasswordConfirm" placeholder="กรอกรหัสผ่านซ้ำอีกครั้ง" required minlength="6">
                  </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fs-6">
                  ยืนยันการสมัครสมาชิก <i class="bi bi-check-circle ms-1"></i>
                </button>

                <div id="registerAlert" class="d-none"></div>
              </form>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <footer class="mt-auto py-3 border-top text-center text-muted small bg-body-tertiary">
    <div class="container">
      &copy; 2026 TimeWise Scheduler &bull; Web Application Platform
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/script.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
